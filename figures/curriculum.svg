<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 820 170" width="820" height="170" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Inter,sans-serif"><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 z" fill="#5A5A6E"/></marker></defs><text x="8" y="30" font-family="IBM Plex Mono,monospace" font-size="10" letter-spacing="0.05em" fill="#656579">BUDGET (3T UPDATE TOKENS), LEFT → RIGHT IN TRAINING ORDER</text><rect x="8" y="62" width="362" height="60" rx="6" fill="#ECEEF8" stroke="#2E357E" stroke-width="1.4"/><text x="189" y="84" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="600" fill="#2E357E">Foundation</text><text x="189" y="102" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="13" fill="#2E357E">45%</text><text x="189" y="116" text-anchor="middle" font-family="Inter,sans-serif" font-size="9.5" fill="#4a4a5e">general web, early code</text><text x="189" y="138" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="9" fill="#656579">up to 8k</text><rect x="370" y="62" width="241" height="60" rx="6" fill="#E6F3F0" stroke="#147D74" stroke-width="1.4"/><text x="490" y="84" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="600" fill="#147D74">Expansion</text><text x="490" y="102" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="13" fill="#147D74">30%</text><text x="490" y="116" text-anchor="middle" font-family="Inter,sans-serif" font-size="9.5" fill="#4a4a5e">code, STEM, reasoning</text><text x="490" y="138" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="9" fill="#656579">up to 32k</text><rect x="611" y="62" width="185" height="60" rx="6" fill="#FBF1E0" stroke="#E0982B" stroke-width="1.4"/><text x="703" y="84" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="600" fill="#E0982B">Reasoning + LC</text><text x="703" y="102" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="13" fill="#E0982B">23%</text><text x="703" y="116" text-anchor="middle" font-family="Inter,sans-serif" font-size="9.5" fill="#4a4a5e">scarce lanes, long docs</text><text x="703" y="138" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="9" fill="#656579">up to 128k</text><rect x="796" y="62" width="16" height="60" rx="6" fill="#FBEEF3" stroke="#B5476B" stroke-width="1.4"/><text x="804" y="84" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="600" fill="#B5476B">Anneal</text><text x="804" y="102" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="13" fill="#B5476B">2%</text><text x="804" y="138" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="9" fill="#656579">held in-budget</text><text x="8" y="162" font-family="Inter,sans-serif" font-size="10" font-style="italic" fill="#656579">Max sequence length rises left to right; transitions are gradual (overlapping bands), not step changes.</text></svg>
